# Swale: the built frontend at /, the API and demo console proxied to uvicorn on 127.0.0.1:8000.
# Requests that spend paid credits (POST: simulations, briefings, audio) are rate-limited per visitor.
# Behind CloudFront the visitor's address is in X-Forwarded-For; use it, falling back to the peer address.
map $http_x_forwarded_for $swale_client { "" $binary_remote_addr; default $http_x_forwarded_for; }
map $request_method $swale_post_key { POST $swale_client; default ""; }
limit_req_zone $swale_post_key zone=swale_spend:10m rate=20r/m;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1m;

    root /opt/swale/frontend/dist;
    index index.html;

    # Server-sent events (live inspections and alert packs): no buffering, long reads.
    location /api/v1/stream/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        limit_req zone=swale_spend burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location ~ ^/(dev|docs|redoc)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
