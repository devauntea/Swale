<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F6F9FD" />
    <script>
      // Apply the explicit preference before styles or React can paint.
      (() => {
        let theme = "light";
        try {
          if (localStorage.getItem("swale.theme") === "dark") theme = "dark";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="color-scheme"]').content = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0B1220" : "#F6F9FD";
      })();
    </script>
    <meta
      name="description"
      content="Swale — a standalone 3D Brooklyn flood-readiness planning demonstration. Synthetic examples, transparent evidence."
    />
    <link rel="icon" type="image/svg+xml" href="/swale.svg" />
    <title>Swale — Brooklyn Planning Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
